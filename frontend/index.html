<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Auth API - Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Secure Auth API</h1>
      <span class="subtitle">Interface de teste de autenticação JWT</span>
    </div>
    <div class="topbar-actions">
      <span id="api-status" class="status">
        <span class="status-dot"></span>
        <span class="status-text">Não verificado</span>
      </span>
      <button id="theme-toggle" type="button" class="btn btn-ghost">Modo escuro</button>
    </div>
  </header>

  <main class="container">
    <!-- Mensagens de alerta -->
    <div id="alert" class="alert hidden" role="alert"></div>

    <!-- Cartão de autenticação -->
    <section id="auth-card" class="card auth-card">
      <div class="tabs" role="tablist">
        <button id="tab-login" type="button" class="tab active" role="tab" aria-selected="true">Entrar</button>
        <button id="tab-register" type="button" class="tab" role="tab" aria-selected="false">Criar conta</button>
      </div>

      <!-- Formulário de login -->
      <form id="form-login" class="form">
        <div class="field">
          <label for="login-username">Usuário ou e-mail</label>
          <input type="text" id="login-username" name="login-username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" name="login-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>

      <!-- Formulário de registro -->
      <form id="form-register" class="form hidden">
        <div class="field">
          <label for="reg-username">Usuário</label>
          <input type="text" id="reg-username" name="reg-username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" name="reg-email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="reg-password">Senha</label>
          <input type="password" id="reg-password" name="reg-password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
      </form>
    </section>

    <!-- Painel do usuário autenticado (ainda sem dados reais) -->
    <section id="user-panel" class="card user-panel hidden">
      <h2>Usuário autenticado</h2>
      <dl class="user-data">
        <dt>Usuário</dt>
        <dd id="user-username">-</dd>
        <dt>E-mail</dt>
        <dd id="user-email">-</dd>
      </dl>
      <h3>Token JWT ativo</h3>
      <pre id="user-token" class="token-box">-</pre>
      <button id="logout-btn" type="button" class="btn btn-danger">Sair</button>
    </section>
  </main>

  <script src="js/theme.js"></script>
</body>
</html>
